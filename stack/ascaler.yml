version: "3.7"

networks:
  ascaler:

configs:
  prometheus_config:
    file: ./config/prometheus.yml

services:
  ascaler:
    image: ascaler:local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - CPU_UPPER_LIMIT=70
      - CPU_LOWER_LIMIT=25
      - WAIT_TIME=10s
      - CPU_TARGET=60
      - CPU_WINDOW_UP=15s
      - CPU_WINDOW_DOWN=2m
      - MAX_DOWN_STEP=2
    networks:
      - ascaler
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    networks:
      - ascaler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.50'
          memory: 64M

  prometheus:
    image: prom/prometheus:latest
    networks:
      - ascaler
    command: ["--storage.tsdb.retention.size=1GB", "--config.file=/etc/prometheus/prometheus.yml", "--web.console.libraries=/etc/prometheus/console_libraries", "--web.console.templates=/etc/prometheus/consoles", "--web.enable-lifecycle"]
    configs:
       - source: prometheus_config
         target: /etc/prometheus/prometheus.yml
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.50'
          memory: 1024M
        reservations:
          cpus: '0.50'
          memory: 128M
